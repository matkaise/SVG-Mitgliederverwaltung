services:
  vereinsverwaltung:
    build: .
    image: gut-mitgliederverwaltung:local
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8180}:3000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
